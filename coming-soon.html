<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | SafeGuard Pest Control</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2314b8a6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50:'#f0fdfa',100:'#ccfbf1',200:'#99f6e4',300:'#5eead4',400:'#2dd4bf',500:'#14b8a6',600:'#0d9488',700:'#0f766e',800:'#115e59',900:'#134e4a' },
                        secondary: { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d' }
                    },
                    fontFamily: { heading:['Poppins','sans-serif'], body:['Inter','sans-serif'] },
                    animation: {
                        'float':'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float:{'0%,100%':{transform:'translateY(0)'},'50%':{transform:'translateY(-20px)'}},
                    },
                },
            },
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-heading { font-family: 'Poppins', sans-serif; }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: blobMove 8s ease-in-out infinite alternate;
        }
        .blob-1 {
            width: 500px; height: 500px;
            background: #14b8a6;
            top: -10%; left: -10%;
            animation-delay: 0s;
        }
        .blob-2 {
            width: 400px; height: 400px;
            background: #22c55e;
            bottom: -10%; right: -10%;
            animation-delay: 2s;
        }
        .blob-3 {
            width: 300px; height: 300px;
            background: #0d9488;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 4s;
        }
        @keyframes blobMove {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.05); }
            66% { transform: translate(-20px, 30px) scale(0.95); }
            100% { transform: translate(10px, -10px) scale(1.02); }
        }
        .gradient-text {
            background: linear-gradient(135deg, #14b8a6, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .countdown-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
        }
        .back-to-top {
            transition: opacity 0.3s, transform 0.3s;
        }
        .back-to-top.hidden-btn {
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen overflow-x-hidden relative font-body">

    <!-- Top Nav -->
    <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 bg-gray-900/80 backdrop-blur-md border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3 group">
                <div class="w-12 h-12 bg-gradient-to-br from-primary-500 to-secondary-500 rounded-xl flex items-center justify-center shadow-lg hover:scale-105 transition-transform">
                    <i data-lucide="shield-check" class="w-7 h-7 text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-heading font-semibold text-primary-700 dark:text-primary-400 group-hover:text-primary-500 transition-colors">SafeGuard</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 -mt-1">Pest Control</p>
                </div>
            </a>
            <div class="flex items-center gap-3">
                <button id="themeToggle" class="w-9 h-9 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center transition-colors" aria-label="Toggle theme">
                    <i data-lucide="sun" class="w-4 h-4"></i>
                </button>
                <a href="index.html" class="px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm font-medium text-gray-300 hover:text-white transition-colors flex items-center gap-2">
                    <i data-lucide="home" class="w-4 h-4"></i>
                    Home
                </a>
            </div>
        </div>
    </nav>

    <!-- Animated Background Blobs -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Main Content -->
    <main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-4 py-24">

        <!-- Construction Icon -->
        <div class="mb-8 animate-float">
            <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-gradient-to-br from-primary-500 to-secondary-500 flex items-center justify-center shadow-lg shadow-primary-500/20">
                <i data-lucide="construction" class="w-10 h-10 sm:w-12 sm:h-12 text-white"></i>
            </div>
        </div>

        <!-- Heading -->
        <h1 class="font-heading text-4xl sm:text-5xl md:text-6xl font-semibold text-center mb-4 gradient-text">Coming Soon</h1>
        <p class="text-gray-400 text-center text-base sm:text-lg max-w-md mb-12">We're working hard to bring you the best pest control experience. Stay tuned!</p>

        <!-- Countdown Timer -->
        <div class="flex gap-3 sm:gap-4 mb-12">
            <div class="countdown-box rounded-xl px-4 sm:px-6 py-4 text-center min-w-[72px] sm:min-w-[90px]">
                <span id="days" class="block text-2xl sm:text-3xl font-heading font-semibold text-white">00</span>
                <span class="text-xs sm:text-sm text-gray-400 uppercase tracking-wider">Days</span>
            </div>
            <div class="countdown-box rounded-xl px-4 sm:px-6 py-4 text-center min-w-[72px] sm:min-w-[90px]">
                <span id="hours" class="block text-2xl sm:text-3xl font-heading font-semibold text-white">00</span>
                <span class="text-xs sm:text-sm text-gray-400 uppercase tracking-wider">Hours</span>
            </div>
            <div class="countdown-box rounded-xl px-4 sm:px-6 py-4 text-center min-w-[72px] sm:min-w-[90px]">
                <span id="minutes" class="block text-2xl sm:text-3xl font-heading font-semibold text-white">00</span>
                <span class="text-xs sm:text-sm text-gray-400 uppercase tracking-wider">Mins</span>
            </div>
            <div class="countdown-box rounded-xl px-4 sm:px-6 py-4 text-center min-w-[72px] sm:min-w-[90px]">
                <span id="seconds" class="block text-2xl sm:text-3xl font-heading font-semibold text-white">00</span>
                <span class="text-xs sm:text-sm text-gray-400 uppercase tracking-wider">Secs</span>
            </div>
        </div>

        <!-- Email Signup Form -->
        <div class="w-full max-w-md mb-12">
            <form id="coming-soon-form" class="flex flex-col sm:flex-row gap-3">
                <input type="email" placeholder="Enter your email" required
                    class="flex-1 px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500 transition-colors text-sm" />
                <button type="submit"
                    class="px-6 py-3 rounded-xl bg-gradient-to-r from-primary-500 to-secondary-500 text-white font-semibold text-sm hover:shadow-lg hover:shadow-primary-500/25 transition-all whitespace-nowrap">
                    Notify Me
                </button>
            </form>
            <p id="form-success" class="hidden mt-3 text-center text-secondary-400 text-sm font-medium">Thank you! We'll notify you when we launch.</p>
        </div>

        <!-- Social Media Links -->
        <div class="flex items-center gap-4">
            <a href="https://facebook.com/safeguardpestcontrol" target="_blank" rel="noopener noreferrer"
                class="w-10 h-10 rounded-lg bg-white/5 hover:bg-primary-500/20 flex items-center justify-center text-gray-400 hover:text-primary-400 transition-all" aria-label="Facebook">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            </a>
            <a href="https://twitter.com/safeguardpest" target="_blank" rel="noopener noreferrer"
                class="w-10 h-10 rounded-lg bg-white/5 hover:bg-primary-500/20 flex items-center justify-center text-gray-400 hover:text-primary-400 transition-all" aria-label="Twitter">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            </a>
            <a href="https://instagram.com/safeguardpestcontrol" target="_blank" rel="noopener noreferrer"
                class="w-10 h-10 rounded-lg bg-white/5 hover:bg-primary-500/20 flex items-center justify-center text-gray-400 hover:text-primary-400 transition-all" aria-label="Instagram">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
            </a>
            <a href="https://linkedin.com/company/safeguardpestcontrol" target="_blank" rel="noopener noreferrer"
                class="w-10 h-10 rounded-lg bg-white/5 hover:bg-primary-500/20 flex items-center justify-center text-gray-400 hover:text-primary-400 transition-all" aria-label="LinkedIn">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
            </a>
        </div>
    </main>

    <!-- Back to Top Button -->
    <button id="backToTop" class="back-to-top hidden-btn fixed bottom-6 right-6 z-50 w-11 h-11 rounded-xl bg-primary-500/90 hover:bg-primary-500 text-white flex items-center justify-center shadow-lg shadow-primary-500/20 transition-all" aria-label="Back to top">
        <i data-lucide="arrow-up" class="w-5 h-5"></i>
    </button>

    <script src="main.js"></script>
    <script>
        lucide.createIcons();

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        // Check saved theme or default to dark
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            html.classList.remove('dark');
            themeToggle.innerHTML = '<i data-lucide="moon" class="w-4 h-4"></i>';
            lucide.createIcons();
        }
        
        themeToggle.addEventListener('click', function() {
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.innerHTML = isDark ? '<i data-lucide="sun" class="w-4 h-4"></i>' : '<i data-lucide="moon" class="w-4 h-4"></i>';
            lucide.createIcons();
        });

        // Countdown Timer - 30 days from now
        const launchDate = new Date();
        launchDate.setDate(launchDate.getDate() + 30);

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = launchDate.getTime() - now;

            if (distance <= 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Email form submit
        document.getElementById('coming-soon-form').addEventListener('submit', function(e) {
            e.preventDefault();
            this.classList.add('hidden');
            document.getElementById('form-success').classList.remove('hidden');
        });

        // Back to top button
        const backToTopBtn = document.getElementById('backToTop');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 300) {
                backToTopBtn.classList.remove('hidden-btn');
            } else {
                backToTopBtn.classList.add('hidden-btn');
            }
        });
        backToTopBtn.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
